name: Publish

# Publishes the extension to Open VSX (Cursor) and the VS Code Marketplace.
# Triggers on a version tag push (e.g. `git tag v0.5.0 && git push origin v0.5.0`)
# or a manual run (Actions → Publish → "Run workflow" from main, with the `tag`
# input set) so an existing tag can be (re)published without re-tagging.
#
# Auth:
#   OVSX_TOKEN  — repo secret, Open VSX access token (for Cursor)   https://open-vsx.org
#   VS Code Marketplace — Trusted Publishing (OIDC), no secret. The publisher
#     `promptconduit` has a policy allowing promptconduit/editor-extension's
#     publish.yml (Marketplace → Manage → Trusted Publishing). The job needs
#     `id-token: write`. Replaces VSCE_PAT (Azure DevOps global PATs retire 2026-12-01).
# The Open VSX step runs only when its secret is set. Both registries get the SAME .vsix (packaged once),
# and both publish with --skip-duplicate, so re-running an existing tag skips the
# registry that already has that version and publishes to the other. That is how
# an existing tag reaches the Marketplace the first time:
# run this workflow from main with `tag` set to the latest tag. Open VSX publishes first, so a
# Marketplace failure (trusted-publishing policy, etc.) turns the run red without blocking the
# Cursor release.
#
# Optional third secret:
#   CLI_DISPATCH_TOKEN — a PAT that can trigger workflows in promptconduit/cli.
# When set, a final step pings the CLI's "Refresh bundled extension" workflow so
# it rebuilds its embedded .vsix from this repo's main right after a release,
# instead of waiting for that repo's weekly refresh schedule. No-op if unset.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag to publish (e.g. v0.23.0). Leave empty to publish the ref the run
          was started from. Run from main to use this workflow's current logic
          against an older tag.
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # VS Code Marketplace trusted publishing (OIDC)
    # Hoisted to JOB level on purpose: GitHub Actions does NOT expose a step's
    # own `env:` block to that same step's `if:` condition, so the previous
    # step-level env made `if: env.OVSX_TOKEN != ''` always evaluate empty and
    # both publish steps skipped even when the secrets were set. Job-level env
    # IS visible to step `if:` expressions, which is what makes the gating work.
    env:
      OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
      CLI_DISPATCH_TOKEN: ${{ secrets.CLI_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # `vsce package` runs the `vscode:prepublish` script (npm run compile).
      - name: Package .vsix
        run: npx vsce package -o promptconduit.vsix

      - name: Publish to Open VSX (Cursor)
        id: ovsx
        if: ${{ env.OVSX_TOKEN != '' }}
        run: npx ovsx publish promptconduit.vsix --pat "$OVSX_TOKEN" --skip-duplicate

      - name: Publish to VS Code Marketplace (trusted publishing)
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath promptconduit.vsix --skip-duplicate

      - name: Warn about skipped registries
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$OVSX_TOKEN" ]; then
            echo "::warning::OVSX_TOKEN is not set, so Open VSX was skipped."
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: promptconduit-vsix
          path: promptconduit.vsix
          if-no-files-found: ignore

      # Tell the CLI to refresh its embedded copy of this extension. The CLI's
      # "Refresh bundled extension" workflow keys on the package.json version, so
      # a bump merged before this tag will produce a refresh PR there.
      - name: Refresh the CLI's bundled extension
        if: ${{ !cancelled() && env.CLI_DISPATCH_TOKEN != '' && steps.ovsx.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ env.CLI_DISPATCH_TOKEN }}
        run: gh api -X POST repos/promptconduit/cli/dispatches -f event_type=extension-released
